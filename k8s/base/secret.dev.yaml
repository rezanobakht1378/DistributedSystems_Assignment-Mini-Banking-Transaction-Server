# Development credentials only. For any shared cluster, create the Secret
# out of band (kubectl create secret generic banking-db-credentials ...) and
# remove this file from the kustomization. Values must be URL-safe because
# they are embedded in connection URLs.
apiVersion: v1
kind: Secret
metadata:
  name: banking-db-credentials
type: Opaque
stringData:
  superuser-name: banking
  superuser-password: dev-superuser-6f3c1a
  replication-password: dev-replication-91be47
  app-password: dev-app-2d8e5f
