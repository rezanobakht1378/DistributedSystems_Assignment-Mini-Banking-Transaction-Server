apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: banking

resources:
  - namespace.yaml
  - rbac.yaml
  - secret.dev.yaml
  - config.yaml
  - postgres-scripts.yaml
  - databases/shard-a-db.yaml
  - databases/shard-b-db.yaml
  - databases/coordinator-db.yaml
  - apps/db-controller.yaml
  - apps/shard-a-app.yaml
  - apps/shard-b-app.yaml
  - apps/gateway.yaml
  - network-policies.yaml
  - monitoring.yaml
  - backup.yaml
  - ingress.yaml

# The application version for every Deployment. Rolling updates and
# rollbacks change only this tag (or use kubectl set image).
images:
  - name: mini-banking-app
    newName: mini-banking-app
    newTag: "1.3.5"
