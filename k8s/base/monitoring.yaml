# Prometheus scrapes every Pod annotated prometheus.io/scrape=true in this
# namespace. Alert rules cover failures, application vs database
# availability, and unresolved 2PC transactions. Open the UI with:
#   kubectl -n banking port-forward svc/prometheus 9090:9090
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: banking-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [banking]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: Running
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: (.+);(.+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            regex: (.+)
            target_label: __metrics_path__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app
  alerts.yml: |
    groups:
      - name: banking-availability
        rules:
          - alert: ShardReplicaNotReady
            expr: bank_app_ready == 0
            for: 30s
            annotations:
              summary: "{{ $labels.pod }} is alive but not serving (database or readiness failure)"
          - alert: ShardDatabaseUnavailableToApps
            expr: max by (shard) (bank_db_up) == 0
            for: 15s
            annotations:
              summary: "No replica of {{ $labels.shard }} reaches a writable primary"
          - alert: DatabaseNotWritable
            expr: bank_db_writable == 0
            for: 30s
            annotations:
              summary: "{{ $labels.cluster }} has no reachable primary with a synchronous standby; commits block"
          - alert: DatabaseStandbyMissing
            expr: bank_db_sync_standby_connected == 0
            for: 30s
            annotations:
              summary: "{{ $labels.cluster }} has no synchronous standby"
          - alert: DatabaseFailoverHappened
            expr: increase(bank_db_failovers_total[10m]) > 0
            annotations:
              summary: "{{ $labels.cluster }} changed its primary ({{ $labels.reason }})"
          - alert: DatabaseNonLeaderFenced
            expr: increase(bank_db_fenced_pods_total[10m]) > 0
            annotations:
              summary: "{{ $labels.cluster }}: a non-leader ran as primary and was fenced"
          - alert: CoordinatorDatabaseUnavailable
            expr: max(bank_coordinator_db_up) == 0
            for: 15s
            annotations:
              summary: "Cross-shard transfers are blocked: coordinator database unavailable"
      - name: banking-transactions
        rules:
          - alert: UnresolvedTwoPhaseCommit
            expr: max(bank_2pc_transactions{state=~"PREPARING|COMMIT|ABORT"}) > 0
            for: 1m
            annotations:
              summary: "Coordinated transfers stayed unresolved for over a minute"
          - alert: GatewayServerErrors
            expr: >
              sum(rate(bank_gateway_requests_total{status=~"5.."}[1m]))
              / clamp_min(sum(rate(bank_gateway_requests_total[1m])), 1e-9) > 0.05
            for: 2m
            annotations:
              summary: "More than 5% of gateway requests fail with 5xx"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
